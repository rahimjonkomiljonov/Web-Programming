<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colour Palette | Week 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="../assets/frame.css">
  <style>
    body {
      font-family: var(--font-body);
      
    }
    main { padding: 20px; }
    .palette {
      display: flex;
      gap: 12px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
    }
    .swatch {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 13px;
      font-family: monospace;
      flex-shrink: 0;
    }
    .c1 { background-color: #EF4444; }
    .c2 { background-color: #F59E0B; }
    .c3 { background-color: #10B981; }
    .c4 { background-color: #3B82F6; }
    .c5 { background-color: #8B5CF6; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">WP</span>Web Programming</a>
    <div class="crumbs" role="navigation" aria-label="Breadcrumb">
      <a href="index.html">Week 3</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">Colour Palette</span>
    </div>
  </header>
<main>
  <div class="palette">
    <div class="swatch c1">#EF4444</div>
    <div class="swatch c2">#F59E0B</div>
    <div class="swatch c3">#10B981</div>
    <div class="swatch c4">#3B82F6</div>
    <div class="swatch c5">#8B5CF6</div>
  </div>
</main>
<script src="../site-nav.js" defer></script>
</body>
</html>
