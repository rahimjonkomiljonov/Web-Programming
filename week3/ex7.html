<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Card | Week 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="../assets/frame.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      
    }

    main { padding: 40px 16px; }

    .card {
      background-color: #ffffff;
      border: 1px solid #bbf7d0;
      border-radius: 16px;
      padding: 36px;
      max-width: 360px;
      margin: 0 auto;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #15803d;
      color: white;
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #15803d;
      margin-bottom: 6px;
    }

    .role {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .skills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      background-color: #dcfce7;
      color: #15803d;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">WP</span>Web Programming</a>
    <div class="crumbs" role="navigation" aria-label="Breadcrumb">
      <a href="index.html">Week 3</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">Portfolio Card</span>
    </div>
  </header>
<main>
  <div class="card">
    <div class="avatar">R</div>
    <h2 class="name">Rahimjon</h2>
    <p class="role">Web Programming Student</p>
    <hr>
    <div class="skills">
      <span class="badge">HTML5</span>
      <span class="badge">CSS3</span>
      <span class="badge">Flexbox</span>
    </div>
  </div>
</main>
<script src="../site-nav.js" defer></script>
</body>
</html>
