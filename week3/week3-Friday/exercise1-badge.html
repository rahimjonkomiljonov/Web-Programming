<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E1 - Position the Badge</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #f0fdf4;
    padding: 20px;
  }
  .card {
    width: 280px;
    height: 180px;
    background-color: #ffffff;
    border: 2px solid #15803d;
    border-radius: 12px;
    position: relative;
    margin: 40px;
  }
  .badge {
    position: absolute;
    top: -12px;
    right: 16px;
    background-color: #15803d;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .card p {
    padding: 20px;
    color: #166534;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">NEW</span>
    <p>Rahimjon's Web Programming Notes</p>
  </div>
</body>
</html>
