<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E2 - Hover Card with Transition</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    padding: 40px;
    background-color: #f0fdf4;
  }
  .card {
    background-color: white;
    border: 2px solid #15803d;
    border-radius: 12px;
    padding: 24px;
    width: 240px;
    color: #166534;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 28px rgba(21, 128, 61, 0.25);
  }
</style>
</head>
<body>
  <div class="card">Hover over me, I lift up!</div>
</body>
</html>
