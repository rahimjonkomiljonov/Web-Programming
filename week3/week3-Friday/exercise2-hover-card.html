<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E2 - Hover Card with Transition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="../../assets/frame.css">
<style>
  body {
    font-family: var(--font-body);
  }
  main { padding: 40px; }
  .card {
    background-color: white;
    border: 2px solid #15803d;
    border-radius: 12px;
    padding: 24px;
    width: 240px;
    color: #166534;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 28px rgba(21, 128, 61, 0.25);
  }
</style>
</head>
<body>
  <header class="site-header">

      <span aria-hidden="true">/</span>
      <span aria-current="page">Hover Card</span>
    </div>
  </header>
<main>
  <div class="card">Hover over me, I lift up!</div>
</main>

</body>
