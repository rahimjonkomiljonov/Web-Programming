<style>
  main { display: flex; justify-content: center; align-items: center; height: 200px; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .spinner {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 4px solid #bbf7d0;
    border-top-color: #15803d;
    animation: spin 0.8s linear infinite;
  }
</style>
