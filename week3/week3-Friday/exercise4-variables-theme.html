<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E4 - CSS Variables Theme</title>
  <link rel="preload" href="../../assets/fonts/BricolageGrotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/fonts/IBMPlexSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/frame.css">
<style>
  :root {
    --primary: #15803d;
    --accent:  #22c55e;
    --bg:      #f6f1e7;
    --text:    #1e293b;
    --radius:  10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:   #052e16;
      --text: #dcfce7;
    }
  }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    
  }
  main { padding: 20px; }
  .btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--accent); }
  .card {
    background: var(--bg);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 16px;
    color: var(--text);
  }
</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../../index.html"><span class="brand-mark" aria-hidden="true">WP</span>Web Programming</a>
    <div class="crumbs" role="navigation" aria-label="Breadcrumb">
      <a href="../index.html">Week 3</a>
      <span aria-hidden="true">/</span>
      <a href="index.html">Friday</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">Variables Theme</span>
    </div>
  </header>
<main>
  <button class="btn">Contact Rahimjon</button>
  <div class="card">A themed card built entirely with CSS custom properties.</div>
</main>
<script src="../../site-nav.js" defer></script>
</body>
</html>
