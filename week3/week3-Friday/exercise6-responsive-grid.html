<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>E6 - Responsive Grid Page</title>
<style>
  :root {
    --primary: #15803d; --accent: #22c55e;
    --bg: #f0fdf4;       --text: #1e293b;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #052e16; --text: #dcfce7; }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: 'Segoe UI', sans-serif; padding: 24px; }
  h1 { color: var(--primary); margin-bottom: 24px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }

  .card {
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    font-size: 15px;
    font-weight: 600;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 28px rgba(21, 128, 61, 0.2);
  }
  .card[data-icon]::before {
    content: attr(data-icon);
    display: block;
    font-size: 2.2rem;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <h1>Rahimjon's CSS Toolkit</h1>
  <div class="grid">
    <div class="card" data-icon="📍">Position - static, relative, absolute, fixed, sticky</div>
    <div class="card" data-icon="🎯">Pseudo-classes - :hover, :focus, :nth-child</div>
    <div class="card" data-icon="✨">Pseudo-elements - ::before, ::after</div>
    <div class="card" data-icon="🎬">@keyframes - custom animations</div>
    <div class="card" data-icon="🧩">CSS Variables - reusable design tokens</div>
    <div class="card" data-icon="🗂">CSS Grid - responsive 2D layouts</div>
  </div>
</body>
</html>
