<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e7">
  <title>Exercise 1 - Click Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    #count { margin: 22px 0 4px; color: var(--accent); font: 700 3.6rem/1 var(--font-display); }
    #message { min-height: 1.7em; margin-bottom: 0; }
    #clicker { margin-top: 10px; }
    #clicker.done { background: var(--green); }
    #clicker.done:hover { background: #17613c; }
  </style>
</head>
<body class="pw-540">
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">WP</span>Web Programming</a>
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="index.html">Week 4</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">Click Counter</span>
    </nav>
  </header>
  <main class="wrap"><div class="panel panel-center">
    <span class="eyebrow">Week 4 · Exercise 1</span>
    <h1>Click Counter</h1>
    <p>Click the button five times to complete the challenge.</p>
    <button id="clicker" type="button">Click me!</button>
    <p id="count" aria-live="polite">0</p>
    <p id="message" aria-live="polite">Keep clicking...</p>
  </div></main>
  <script>
    const button = document.querySelector('#clicker');
    const countDisplay = document.querySelector('#count');
    const message = document.querySelector('#message');
    let count = 0;

    button.addEventListener('click', () => {
      count++;
      countDisplay.textContent = count;

      if (count >= 5) {
        button.classList.add('done');
        message.textContent = 'Congratulations! You clicked five times!';
      }
    });
  </script>
<script src="../site-nav.js" defer></script>
</body>
</html>
