<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e7">
  <title>Exercise 2 - Dark Mode Profile Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    main.profile-card { width: min(100% - 40px, 380px); margin: 56px auto; padding: 32px; text-align: center; transition: background-color 180ms ease, color 180ms ease; }
    .profile-card .eyebrow { justify-content: center; }
    .avatar { display: grid; place-items: center; width: 88px; height: 88px; margin: 20px auto 14px; border: var(--stroke); border-radius: 50%; background: var(--marker); font-size: 2.2rem; }
    .profile-card h1 { font-size: 1.9rem; }
    .role { margin: 6px 0 0; color: var(--muted); }
    #toggle-btn { margin-top: 24px; }
    .profile-card.dark { background: var(--ink); color: var(--paper); box-shadow: 4px 4px 0 var(--accent); }
    .profile-card.dark h1 { color: var(--paper); }
    .profile-card.dark .eyebrow { color: var(--marker); }
    .profile-card.dark .eyebrow::before { background: var(--marker); }
    .profile-card.dark .role { color: #d8d0bd; }
    .profile-card.dark #toggle-btn { border-color: var(--marker); background: var(--marker); color: var(--ink); box-shadow: 0 3px 0 var(--paper); }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">WP</span>Web Programming</a>
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="index.html">Week 4</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">Kim Jisoo</span>
    </nav>
  </header>
  <main id="card" class="panel profile-card">
    <span class="eyebrow">Week 4 · Exercise 2</span>
    <div class="avatar" aria-hidden="true">👩‍💻</div>
    <h1>Kim Jisoo</h1>
    <p class="role">Web Programming Student</p>
    <button id="toggle-btn" type="button" aria-pressed="false">Dark Mode</button>
  </main>
  <script>
    const card = document.querySelector('#card');
    const toggleButton = document.querySelector('#toggle-btn');

    toggleButton.addEventListener('click', () => {
      card.classList.toggle('dark');
      const isDark = card.classList.contains('dark');
      toggleButton.textContent = isDark ? 'Light Mode' : 'Dark Mode';
      toggleButton.setAttribute('aria-pressed', String(isDark));
    });
  </script>
<script src="../site-nav.js" defer></script>
</body>
</html>
