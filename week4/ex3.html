<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e7">
  <title>Exercise 3 - To-Do List</title>
  <link rel="preload" href="../assets/fonts/BricolageGrotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/IBMPlexSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/frame.css">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    .add-row { display: flex; gap: 10px; }
    .add-row input { flex: 1; min-width: 0; }
    #todo-list { display: grid; gap: 10px; margin: 22px 0 0; padding: 0; list-style: none; }
    .todo-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: var(--stroke); border-radius: 8px; background: var(--surface); overflow-wrap: anywhere; }
    .del-btn { flex: none; min-height: 36px; padding: 0 12px; background: #fde8e6; box-shadow: none; color: var(--danger); font-size: 0.9rem; }
    .del-btn:hover { background: var(--danger); color: #fff; box-shadow: none; }
    #empty-msg { padding: 20px 0; color: var(--muted); text-align: center; }
    @media (max-width: 420px) { .add-row { flex-direction: column; } }
  </style>
</head>
<body class="pw-540">
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">WP</span>Web Programming</a>
    <div class="crumbs" role="navigation" aria-label="Breadcrumb">
      <a href="index.html">Week 4</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">My To-Do List</span>
    </div>
  </header>
  <main class="wrap">
    <span class="eyebrow">Week 4 · Exercise 3</span>
    <h1>My To-Do List</h1>
    <p class="intro">Add tasks with the button or Enter. Remove a task when it is done.</p>
    <div class="add-row">
      <label for="todo-input" class="visually-hidden">New task</label>
      <input id="todo-input" type="text" placeholder="Add a task..." autocomplete="off">
      <button id="add-btn" type="button">Add task</button>
    </div>
    <ul id="todo-list" aria-label="Tasks"></ul>
    <p id="empty-msg" aria-live="polite">No tasks yet. Add one above.</p>
  </main>
  <script>
    const input = document.querySelector('#todo-input');
    const addButton = document.querySelector('#add-btn');
    const list = document.querySelector('#todo-list');
    const emptyMessage = document.querySelector('#empty-msg');

    function updateEmptyMessage() {
      emptyMessage.hidden = list.children.length > 0;
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }

      const item = document.createElement('li');
      item.className = 'todo-item';

      const taskText = document.createElement('span');
      taskText.textContent = text;

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'del-btn';
      deleteButton.textContent = 'Remove';
      deleteButton.setAttribute('aria-label', `Remove task: ${text}`);

      item.append(taskText, deleteButton);
      list.appendChild(item);
      input.value = '';
      input.focus();
      updateEmptyMessage();
    }

    addButton.addEventListener('click', addTask);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') addTask();
    });

    list.addEventListener('click', (event) => {
      if (!(event.target instanceof Element)) return;
      const deleteButton = event.target.closest('.del-btn');
      if (!deleteButton) return;

      deleteButton.closest('.todo-item').remove();
      updateEmptyMessage();
    });

    updateEmptyMessage();
  </script>
<script src="../site-nav.js" defer></script>
</body>
</html>
