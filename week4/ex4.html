<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4 - Student Search</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background: #f0f4ff;
      color: #1a2340;
      font-family: system-ui, sans-serif;
    }
    main { width: min(100%, 560px); margin: 0 auto; }
    .eyebrow { color: #1a56db; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: 2rem; }
    .intro { margin: 0 0 22px; color: #5a6a8a; }
    #search {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #1a56db;
      border-radius: 6px;
      background: #fff;
      color: #1a2340;
      font: inherit;
    }
    #search:focus-visible { outline: 3px solid #f7df1e; outline-offset: 2px; }
    #student-list { display: grid; gap: 8px; margin-top: 16px; }
    .student {
      padding: 12px 14px;
      border: 1px solid #c8d4f0;
      border-radius: 6px;
      background: #fff;
    }
    mark { border-radius: 2px; background: #f7df1e; color: #1a2340; }
    #no-results { display: none; padding: 18px 0; color: #5a6a8a; text-align: center; }
    #result-count { margin: 12px 0 0; color: #5a6a8a; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Week 4 · Exercise 4</span>
    <h1>Student Search</h1>
    <p class="intro">Search by student name. Results update as you type.</p>
    <label for="search" class="visually-hidden">Search students</label>
    <input id="search" type="search" placeholder="Search students..." autocomplete="off">
    <div id="student-list">
      <div class="student" data-name="Kim Jisoo">Kim Jisoo — Web Programming</div>
      <div class="student" data-name="Park Minjun">Park Minjun — Computer Science</div>
      <div class="student" data-name="Lee Sooyeon">Lee Sooyeon — Software Engineering</div>
      <div class="student" data-name="Choi Hyunwoo">Choi Hyunwoo — Artificial Intelligence</div>
      <div class="student" data-name="Jung Yuna">Jung Yuna — Data Science</div>
      <div class="student" data-name="Kang Seojun">Kang Seojun — Web Programming</div>
    </div>
    <p id="no-results" role="status">No students found.</p>
    <p id="result-count" aria-live="polite"></p>
  </main>
  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
  <script>
    const searchInput = document.querySelector('#search');
    const students = document.querySelectorAll('.student');
    const noResults = document.querySelector('#no-results');
    const resultCount = document.querySelector('#result-count');

    students.forEach((student) => {
      student.dataset.originalText = student.textContent;
    });

    function renderHighlightedName(student, term) {
      const name = student.dataset.name;
      const nameStart = name.toLowerCase().indexOf(term);
      student.replaceChildren();

      if (nameStart < 0 || !term) {
        student.textContent = student.dataset.originalText;
        return;
      }

      const matchEnd = nameStart + term.length;
      student.append(document.createTextNode(name.slice(0, nameStart)));

      const highlight = document.createElement('mark');
      highlight.textContent = name.slice(nameStart, matchEnd);
      student.append(highlight);
      student.append(document.createTextNode(student.dataset.originalText.slice(name.length)));
    }

    searchInput.addEventListener('input', (event) => {
      const term = event.target.value.trim().toLowerCase();
      let visibleCount = 0;

      students.forEach((student) => {
        const matches = student.dataset.name.toLowerCase().includes(term);
        student.hidden = !matches;

        if (matches) {
          visibleCount++;
          renderHighlightedName(student, term);
        }
      });

      noResults.style.display = visibleCount === 0 ? 'block' : 'none';
      resultCount.textContent = `${visibleCount} student${visibleCount === 1 ? '' : 's'} found`;
    });

    resultCount.textContent = `${students.length} students found`;
  </script>
</body>
</html>
