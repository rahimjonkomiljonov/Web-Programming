<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f0f4ff">
  <title>Exercise 5 - Interactive Color Palette</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f0f4ff;
      --surface: #fff;
      --ink: #1a2340;
      --muted: #5a6a8a;
      --line: #c8d4f0;
      --blue: #1a56db;
      --yellow: #f7df1e;
      --red: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 36px 20px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", sans-serif;
    }
    main { width: min(100%, 940px); margin: 0 auto; }
    .back-link { color: var(--blue); font-weight: 700; text-decoration: none; }
    .back-link:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }
    .eyebrow { margin: 24px 0 6px; color: var(--blue); font-size: 0.82rem; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); }
    .intro { max-width: 620px; margin: 10px 0 28px; color: var(--muted); line-height: 1.55; }
    .controls {
      display: flex;
      align-items: end;
      flex-wrap: wrap;
      gap: 12px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .color-form { display: flex; flex: 1 1 320px; align-items: end; gap: 8px; }
    .field { display: grid; flex: 1; gap: 6px; }
    label { color: var(--muted); font-size: 0.9rem; font-weight: 700; }
    input {
      width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid #aebddd;
      border-radius: 4px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }
    button {
      min-height: 42px;
      padding: 10px 15px;
      border: 0;
      border-radius: 4px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1240b0; }
    #export-button { background: var(--ink); }
    #export-button:hover { background: #303d60; }
    .palette-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 24px 0 12px; }
    h2 { margin: 0; font-size: 1.2rem; }
    #color-count { margin: 0; color: var(--muted); font-size: 0.9rem; }
    #palette { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 12px; }
    .swatch {
      display: block;
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      transition: border-color 160ms ease, transform 160ms ease;
    }
    .swatch:hover { transform: translateY(-2px); }
    .swatch__preview {
      display: grid;
      height: 92px;
      place-items: center;
      border-radius: 3px;
      color: #fff;
      font-family: monospace;
      font-size: 1rem;
      font-weight: 800;
      text-shadow: 0 1px 3px #000;
      transition: height 180ms ease;
    }
    .swatch__hex { display: none; margin-top: 9px; font-family: monospace; font-size: 0.95rem; }
    .swatch.is-expanded .swatch__preview { height: 170px; }
    .swatch.is-expanded .swatch__hex { display: block; }
    #status { min-height: 1.5em; margin: 14px 0 0; color: var(--muted); font-size: 0.9rem; }
    #status.error { color: var(--red); }
    @media (max-width: 500px) {
      body { padding: 24px 16px; }
      .color-form { flex-basis: 100%; }
      .color-form button { padding-right: 12px; padding-left: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="index.html">← Week 4 exercises</a>
    <p class="eyebrow">Week 4 · Exercise 5</p>
    <h1>Interactive Color Palette</h1>
    <p class="intro">Select a color to expand it and reveal its hex code. Add colors, double-click a swatch to remove it, or export the palette as a PNG.</p>

    <section class="controls" aria-label="Palette controls">
      <form class="color-form" id="color-form">
        <div class="field">
          <label for="color-input">Add a hex color</label>
          <input id="color-input" type="text" placeholder="#4F46E5" autocomplete="off" spellcheck="false" aria-describedby="status">
        </div>
        <button type="submit">Add color</button>
      </form>
      <button id="export-button" type="button">Export PNG</button>
    </section>

    <div class="palette-heading">
      <h2>Your colors</h2>
      <p id="color-count" aria-live="polite"></p>
    </div>
    <div id="palette" aria-label="Color palette"></div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const storageKey = 'week4-interactive-color-palette';
    const defaultColors = ['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899'];
    const palette = document.querySelector('#palette');
    const colorForm = document.querySelector('#color-form');
    const colorInput = document.querySelector('#color-input');
    const colorCount = document.querySelector('#color-count');
    const status = document.querySelector('#status');
    let colors = loadColors();

    function normalizeHex(value) {
      const match = value.trim().match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (!match) return null;
      let digits = match[1];
      if (digits.length === 3) digits = [...digits].map((digit) => digit + digit).join('');
      return `#${digits.toUpperCase()}`;
    }

    function loadColors() {
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved === null) return [...defaultColors];
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed) || !parsed.every((color) => typeof color === 'string' && normalizeHex(color))) {
          return [...defaultColors];
        }
        return parsed.map(normalizeHex);
      } catch {
        return [...defaultColors];
      }
    }

    function saveColors() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(colors));
        return true;
      } catch {
        return false;
      }
    }

    function announce(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function renderPalette() {
      palette.replaceChildren();
      colors.forEach((color, index) => {
        const swatch = document.createElement('button');
        swatch.type = 'button';
        swatch.className = 'swatch';
        swatch.dataset.index = String(index);
        swatch.setAttribute('aria-expanded', 'false');
        swatch.setAttribute('aria-label', `${color}. Select to reveal the hex code; double-click to remove.`);

        const preview = document.createElement('span');
        preview.className = 'swatch__preview';
        preview.style.backgroundColor = color;
        preview.setAttribute('aria-hidden', 'true');

        const hex = document.createElement('span');
        hex.className = 'swatch__hex';
        hex.textContent = color;

        swatch.append(preview, hex);
        palette.append(swatch);
      });
      colorCount.textContent = `${colors.length} color${colors.length === 1 ? '' : 's'}`;
    }

    colorForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const color = normalizeHex(colorInput.value);
      if (!color) {
        announce('Enter a valid hex color, such as #4F46E5.', true);
        colorInput.focus();
        return;
      }
      if (colors.includes(color)) {
        announce(`${color} is already in the palette.`, true);
        colorInput.focus();
        return;
      }
      colors.push(color);
      renderPalette();
      const saved = saveColors();
      colorInput.value = '';
      announce(saved ? `${color} added and saved.` : `${color} added, but browser storage is unavailable.`);
    });

    palette.addEventListener('click', (event) => {
      if (!(event.target instanceof Element)) return;
      const swatch = event.target.closest('.swatch');
      if (!swatch) return;
      const expanded = swatch.classList.toggle('is-expanded');
      swatch.setAttribute('aria-expanded', String(expanded));
    });

    palette.addEventListener('dblclick', (event) => {
      if (!(event.target instanceof Element)) return;
      const swatch = event.target.closest('.swatch');
      if (!swatch) return;
      const color = colors[Number(swatch.dataset.index)];
      colors.splice(Number(swatch.dataset.index), 1);
      renderPalette();
      const saved = saveColors();
      announce(saved ? `${color} removed and saved.` : `${color} removed, but browser storage is unavailable.`);
    });

    document.querySelector('#export-button').addEventListener('click', () => {
      const columns = 3;
      const cellWidth = 300;
      const cellHeight = 138;
      const gap = 16;
      const padding = 36;
      const headerHeight = 56;
      const rows = Math.max(1, Math.ceil(colors.length / columns));
      const canvas = document.createElement('canvas');
      canvas.width = padding * 2 + columns * cellWidth + (columns - 1) * gap;
      canvas.height = padding * 2 + headerHeight + rows * cellHeight + (rows - 1) * gap;
      const context = canvas.getContext('2d');
      if (!context) {
        announce('PNG export is not available in this browser.', true);
        return;
      }

      context.fillStyle = '#F0F4FF';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#1A2340';
      context.font = 'bold 26px Trebuchet MS, sans-serif';
      context.fillText('Interactive Color Palette', padding, padding + 28);

      colors.forEach((color, index) => {
        const x = padding + (index % columns) * (cellWidth + gap);
        const y = padding + headerHeight + Math.floor(index / columns) * (cellHeight + gap);
        context.fillStyle = '#FFFFFF';
        context.fillRect(x, y, cellWidth, cellHeight);
        context.fillStyle = color;
        context.fillRect(x + 14, y + 14, cellWidth - 28, 78);
        context.fillStyle = '#1A2340';
        context.font = 'bold 18px monospace';
        context.fillText(color, x + 14, y + 119);
      });

      canvas.toBlob((blob) => {
        if (!blob) {
          announce('Could not create the PNG file.', true);
          return;
        }
        const downloadUrl = URL.createObjectURL(blob);
        const downloadLink = document.createElement('a');
        downloadLink.href = downloadUrl;
        downloadLink.download = 'color-palette.png';
        downloadLink.click();
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
        announce('Palette exported as color-palette.png.');
      }, 'image/png');
    });

    renderPalette();
  </script>
<script src="../site-nav.js" defer></script>
</body>
</html>
