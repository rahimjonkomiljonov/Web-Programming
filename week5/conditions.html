<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e7">
  <title>Conditions | Week 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    #result { min-height: 1.6em; margin: 18px 0 0; font: 700 1.3rem/1.3 var(--font-display); }
    .panel form { gap: 4px; }
    .panel button { margin-top: 14px; }
  </style>
</head>
<body class="pw-540">
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">WP</span>Web Programming</a>
    <div class="crumbs" role="navigation" aria-label="Breadcrumb">
      <a href="index.html">Week 5</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">What grade did you get?</span>
    </div>
  </header>
  <main class="wrap"><div class="panel">
    <span class="eyebrow">WEEK 05 · CONDITIONS</span>
    <h1>What grade did you get?</h1>
    <p>Enter a score from 0 to 100. The result is chosen with an if / else if / else chain.</p>
    <form id="grade-form">
      <label for="score">Score</label>
      <input id="score" name="score" type="number" min="0" max="100" step="1" placeholder="e.g. 85" required>
      <button type="submit">Check grade</button>
    </form>
    <p id="result" aria-live="polite"></p>
  </div></main>
  <script>
    const gradeForm = document.querySelector('#grade-form');
    const scoreInput = document.querySelector('#score');
    const result = document.querySelector('#result');

    gradeForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const score = Number(scoreInput.value);

      if (score >= 90) {
        result.textContent = 'Grade A';
      } else if (score >= 80) {
        result.textContent = 'Grade B';
      } else if (score >= 70) {
        result.textContent = 'Grade C';
      } else {
        result.textContent = 'Grade F';
      }
    });
  </script>
  <script src="../site-nav.js" defer></script>
</body>
</html>
