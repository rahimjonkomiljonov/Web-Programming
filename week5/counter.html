<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e7">
  <title>Counter Mini-App | Week 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    .panel { text-align: center; }
    .panel .eyebrow { justify-content: center; }
    #count { display: block; margin: 22px 0; color: var(--accent); font: 700 4.5rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
    .panel .controls { justify-content: center; margin-bottom: 0; }
  </style>
</head>
<body class="pw-540">
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">WP</span>Web Programming</a>
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="index.html">Week 5</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">Counter</span>
    </nav>
  </header>
  <main class="wrap"><div class="panel">
    <span class="eyebrow">WEEK 05 · MINI-APP</span>
    <h1>Counter</h1>
    <p>Use the buttons to change the count.</p>
    <output id="count" aria-live="polite">0</output>
    <div class="controls" aria-label="Counter controls">
      <button id="subtract" class="secondary" type="button">− Subtract</button>
      <button id="add" type="button">+ Add</button>
      <button id="reset" class="secondary" type="button">Reset</button>
    </div>
  </div></main>
  <script>
    const countDisplay = document.querySelector('#count');
    let count = 0;

    function renderCount() {
      countDisplay.textContent = count;
    }

    document.querySelector('#add').addEventListener('click', () => {
      count += 1;
      renderCount();
    });

    document.querySelector('#subtract').addEventListener('click', () => {
      count -= 1;
      renderCount();
    });

    document.querySelector('#reset').addEventListener('click', () => {
      count = 0;
      renderCount();
    });
  </script>
  <script src="../site-nav.js" defer></script>
</body>
</html>
