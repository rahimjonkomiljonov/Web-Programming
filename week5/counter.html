<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef3f1">
  <title>Counter Mini-App | Week 5</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px 20px 96px; background: #eef3f1; color: #172b32; font-family: "Trebuchet MS", system-ui, sans-serif; }
    main { width: min(100%, 440px); padding: 30px; border: 1px solid #cbd9d7; border-top: 5px solid #c84f38; border-radius: 7px; background: #fff; text-align: center; }
    .eyebrow { color: #c84f38; font: 700 0.8rem monospace; }
    h1 { margin: 12px 0 4px; font: 500 2.2rem/1.05 Georgia, "Times New Roman", serif; }
    p { color: #587078; }
    #count { margin: 24px 0; color: #136f63; font: 700 4rem/1 monospace; font-variant-numeric: tabular-nums; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    button { min-width: 104px; min-height: 46px; padding: 0 16px; border: 1px solid #136f63; border-radius: 5px; background: #136f63; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #0e574e; }
    button.secondary { background: #fff; color: #172b32; }
    button.secondary:hover { background: #f0f5f3; }
    button:focus-visible { outline: 3px solid #2859a8; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">WEEK 05 · MINI-APP</span>
    <h1>Counter</h1>
    <p>Use the buttons to change the count.</p>
    <output id="count" aria-live="polite">0</output>
    <div class="controls" aria-label="Counter controls">
      <button id="subtract" class="secondary" type="button">− Subtract</button>
      <button id="add" type="button">+ Add</button>
      <button id="reset" class="secondary" type="button">Reset</button>
    </div>
  </main>
  <script>
    const countDisplay = document.querySelector('#count');
    let count = 0;

    function renderCount() {
      countDisplay.textContent = count;
    }

    document.querySelector('#add').addEventListener('click', () => {
      count += 1;
      renderCount();
    });

    document.querySelector('#subtract').addEventListener('click', () => {
      count -= 1;
      renderCount();
    });

    document.querySelector('#reset').addEventListener('click', () => {
      count = 0;
      renderCount();
    });
  </script>
  <script src="../site-nav.js" defer></script>
</body>
</html>
