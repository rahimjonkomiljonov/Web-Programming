<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eef3f1">
  <title>Loops | Week 5</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px 20px 96px; background: #eef3f1; color: #172b32; font-family: "Trebuchet MS", system-ui, sans-serif; }
    main { width: min(100%, 560px); padding: 28px; border: 1px solid #cbd9d7; border-top: 5px solid #2859a8; border-radius: 7px; background: #fff; }
    .eyebrow { color: #2859a8; font: 700 0.8rem monospace; }
    h1 { margin: 12px 0 8px; font: 500 2.2rem/1.05 Georgia, "Times New Roman", serif; }
    p { color: #587078; line-height: 1.55; }
    button { min-height: 46px; margin: 12px 0 18px; padding: 0 18px; border: 0; border-radius: 5px; background: #2859a8; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #1e447f; }
    button:focus-visible { outline: 3px solid #c84f38; outline-offset: 2px; }
    h2 { margin: 18px 0 6px; font-size: 1rem; }
    ol, ul { margin: 0; padding-left: 24px; line-height: 1.7; }
    #steps { color: #2859a8; }
    @media (max-width: 420px) { main { padding: 22px; } }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">WEEK 05 · LOOPS</span>
    <h1>Repeat a task</h1>
    <p>Press the button to run a for loop five times, then use a for...of loop to list each fruit.</p>
    <button id="run-loops" type="button">Run loops</button>
    <section aria-labelledby="steps-heading">
      <h2 id="steps-heading">Counting loop</h2>
      <ol id="steps" aria-live="polite"></ol>
    </section>
    <section aria-labelledby="fruits-heading">
      <h2 id="fruits-heading">Array loop</h2>
      <ul id="fruits" aria-live="polite"></ul>
    </section>
  </main>
  <script>
    const runButton = document.querySelector('#run-loops');
    const stepsList = document.querySelector('#steps');
    const fruitsList = document.querySelector('#fruits');
    const fruits = ['apple', 'banana', 'cherry'];

    runButton.addEventListener('click', () => {
      stepsList.replaceChildren();
      fruitsList.replaceChildren();

      for (let step = 1; step <= 5; step++) {
        const item = document.createElement('li');
        item.textContent = `Step ${step}`;
        stepsList.append(item);
      }

      for (const fruit of fruits) {
        const item = document.createElement('li');
        item.textContent = fruit;
        fruitsList.append(item);
      }
    });
  </script>
  <script src="../site-nav.js" defer></script>
</body>
</html>
