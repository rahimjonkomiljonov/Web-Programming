<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e7">
  <title>Loops | Week 5</title>
  <link rel="preload" href="../assets/fonts/BricolageGrotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/IBMPlexSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/frame.css">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    .panel button { margin: 6px 0 22px; }
    .panel h2 { margin: 20px 0 8px; font-size: 1.15rem; }
    #steps { color: var(--accent-dark); }
  </style>
</head>
<body class="pw-540">
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">WP</span>Web Programming</a>
    <div class="crumbs" role="navigation" aria-label="Breadcrumb">
      <a href="index.html">Week 5</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">Repeat a task</span>
    </div>
  </header>
  <main class="wrap"><div class="panel">
    <span class="eyebrow">WEEK 05 · LOOPS</span>
    <h1>Repeat a task</h1>
    <p>Press the button to run a for loop five times, then use a for...of loop to list each fruit.</p>
    <button id="run-loops" type="button">Run loops</button>
    <section aria-labelledby="steps-heading">
      <h2 id="steps-heading">Counting loop</h2>
      <ol id="steps" aria-live="polite"></ol>
    </section>
    <section aria-labelledby="fruits-heading">
      <h2 id="fruits-heading">Array loop</h2>
      <ul id="fruits" aria-live="polite"></ul>
    </section>
  </div></main>
  <script>
    const runButton = document.querySelector('#run-loops');
    const stepsList = document.querySelector('#steps');
    const fruitsList = document.querySelector('#fruits');
    const fruits = ['apple', 'banana', 'cherry'];

    runButton.addEventListener('click', () => {
      stepsList.replaceChildren();
      fruitsList.replaceChildren();

      for (let step = 1; step <= 5; step++) {
        const item = document.createElement('li');
        item.textContent = `Step ${step}`;
        stepsList.append(item);
      }

      for (const fruit of fruits) {
        const item = document.createElement('li');
        item.textContent = fruit;
        fruitsList.append(item);
      }
    });
  </script>
  <script src="../site-nav.js" defer></script>
</body>
</html>
